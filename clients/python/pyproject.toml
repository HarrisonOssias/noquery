[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noquery"
version = "0.1.0"
description = "Natural-language analytics for your own database: plug in SQLAlchemy or Django, get safe, typed queries."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.100"]
anthropic = ["anthropic>=1.0; python_version >= '3.10'"]
pandas = ["pandas>=1.5"]
dev = [
    "pytest>=7",
    "sqlalchemy>=2.0",
    "django>=4.2",
    "fastapi>=0.100",
    "httpx>=0.24",
    "anthropic>=1.0; python_version >= '3.10'",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",
    "pgserver>=0.1; platform_system != 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noquery = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
